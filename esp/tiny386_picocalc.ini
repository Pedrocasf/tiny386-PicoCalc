; PicoCalc / ESP32-P4 -- copy this to the root of the microSD card as
; "tiny386.ini", together with bios.bin and vgabios.bin.
;
; The card is read through the ESP32-P4 board's own SDMMC slot.  Note that when
; the card mounts, the flash "storage" partition is not mounted at all (to save
; internal RAM), so every path here has to live on the card.

[pc]
bios = /sdcard/bios.bin
vga_bios = /sdcard/vgabios.bin

; PSRAM_ALLOC_LEN in board_picocalc.h caps the pool at 20 MB, which covers this
; plus VGA memory and the framebuffer.  Raise both together to go further.
mem_size = 16M
vga_mem_size = 256K

; 80x25 text is drawn 1:1 with the built-in 4x10 font (SMALL_TEXT_FONT), which
; needs 8-dot characters -- 9-dot mode would be 720 px wide
vga_force_8dm = 1

; emulated COM1 <-> ESP console, handy with no display or for a serial shell
enable_serial = 1

; disks: fda/fdb floppies, hda..hdd disks, cda..cdd CD-ROMs
hda = /sdcard/hd.img
; cdb = /sdcard/cd.iso

; fixes "MS-DOS compatibility mode" in win9x, but breaks winNT
fill_cmos = 1

[display]
; must match LCD_WIDTH/LCD_HEIGHT in esp/main/board_picocalc.h
width = 320
height = 320

[cpu]
; 3/4/5/6 = 386/486/586/686
gen = 4
fpu = 0
