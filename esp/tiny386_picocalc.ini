; PicoCalc / ESP32-P4 -- copy this to the root of the microSD card as
; "tiny386.ini" if you want the config to live on the card.  The card is read
; through the ESP32-P4 board's own SDMMC slot.
;
; The ROMs do not have to be here: names without a leading '/' are read from
; the flash partitions of the same name, which `idf.py flash` fills from
; bios.bin/vgabios.bin in the repository root.  Only paths starting with '/'
; are files, and those must be on a mounted volume -- /sdcard, or /spiflash if
; MOUNT_SPIFLASH_ALWAYS is set in board_picocalc.h.
;
; esp_main.c prefers this file over the flash copy, and prints which it used.

[pc]
bios = bios.bin
vga_bios = vgabios.bin

; PSRAM_ALLOC_LEN in board_picocalc.h caps the pool at 31 MB, which covers
; this plus VGA memory and the framebuffer.  ~31.5 MB is the most that can be
; reserved contiguously on this board, so 30M is close to the ceiling.
mem_size = 30M
vga_mem_size = 512K

; 80x25 text is drawn 1:1 with the built-in 4x10 font (SMALL_TEXT_FONT), which
; needs 8-dot characters -- 9-dot mode would be 720 px wide
vga_force_8dm = 1

; emulated COM1 <-> ESP console, handy with no display or for a serial shell
enable_serial = 1

; disks: fda/fdb floppies, hda..hdd disks, cda..cdd CD-ROMs.
; This file is the FAT-card arrangement, so the disk is an image file on the
; card.  The other arrangement -- the whole card as the guest's disk via
; hda = /dev/mmcblk0 -- rules this file out, because then the card holds a DOS
; filesystem rather than files the ESP can read; the config lives in flash
; instead (esp/flash_data/tiny386.ini).
hda = /sdcard/hd.img
; cdb = /sdcard/cd.iso

; The PicoCalc's own SD slot is not mounted (see board_picocalc.h); everything
; here lives on the card in the ESP32-P4 board's slot.

; Alternatively give the guest the whole SD card as its hard disk, raw sectors,
; no filesystem in between.  Combined with USB disk mode (hold F1 at power-on)
; a host PC then sees exactly the sectors the guest sees -- partition table and
; boot sector included -- so DOS can be installed and edited from the PC with
; no image file to mount.  In that setup this file and the ROMs have to come
; from the flash storage partition instead (esp/flash_data/), since the card no
; longer holds a filesystem we can read.
; hda = /dev/mmcblk0

; fixes "MS-DOS compatibility mode" in win9x, but breaks winNT
fill_cmos = 1

[display]
; must match LCD_WIDTH/LCD_HEIGHT in esp/main/board_picocalc.h
width = 320
height = 320

[cpu]
; 3/4/5/6 = 386/486/586/686
gen = 4
fpu = 0
