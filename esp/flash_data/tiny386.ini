; PicoCalc / ESP32-P4 -- stage 1, headless bring-up.
;
; Everything in esp/flash_data/, plus bios.bin and vgabios.bin from the
; repository root, is written into the "storage" FAT partition by `idf.py flash`
; (see esp/CMakeLists.txt).  esp_main.c picks this file up as
; /spiflash/tiny386.ini.

[pc]
bios = /spiflash/bios.bin
vga_bios = /spiflash/vgabios.bin

mem_size = 16M
vga_mem_size = 256K

; the 320x320 panel uses SCALE_2_1, and 9-dot text mode (720 px wide) does not
; fit the 640x640 virtual canvas -- force 8-dot text so it does
vga_force_8dm = 1

; emulated COM1 -> ESP console, so a guest can talk to us with no display
enable_serial = 1

; no disk yet: SeaBIOS will report "no bootable device", which is the expected
; stage 1 result.  The ROMs take ~170K of the 10M partition, so an image of up
; to ~9M can go in esp/flash_data/ and be booted from flash; bigger ones belong
; on the SD card (stage 4).
; hda = /spiflash/hd.img

[display]
; must match LCD_WIDTH/LCD_HEIGHT in esp/main/board_picocalc.h
width = 320
height = 320

[cpu]
gen = 4
fpu = 0
