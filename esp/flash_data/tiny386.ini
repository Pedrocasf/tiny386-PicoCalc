; PicoCalc / ESP32-P4 -- config in flash, with the microSD as the guest's disk.
;
; Everything in esp/flash_data/, plus bios.bin and vgabios.bin from the
; repository root, is written into the "storage" FAT partition by `idf.py flash`
; and shows up as /spiflash.  Note that storage.c only mounts that partition
; as /spiflash.  With MOUNT_SPIFLASH_ALWAYS set in board_picocalc.h that
; partition stays mounted even with a card inserted, so this file is the
; config whenever the card does not carry a tiny386.ini of its own.  The
; console prints which one was used.
;
; The ROMs come from the bios.bin/vgabios.bin *partitions* (names without a
; leading '/'), which needs no filesystem at all.

[pc]
bios = bios.bin
vga_bios = vgabios.bin

; PSRAM_ALLOC_LEN in board_picocalc.h caps the pool at 31 MB, which covers this
; plus VGA memory and the framebuffer.  ~31.5 MB is the most that can be
; reserved contiguously on this board, so 30M is close to the ceiling.
mem_size = 30M
vga_mem_size = 512K

; 80x25 text is drawn 1:1 with the built-in 4x10 font (SMALL_TEXT_FONT), which
; needs 8-dot characters -- 9-dot mode would be 720 px wide
vga_force_8dm = 1

; emulated COM1 <-> ESP console, so a guest is reachable with no display
enable_serial = 1

; The whole microSD as the guest's hard disk: ide_attach() takes this name
; specially and hands the card's raw sectors to the emulated IDE, with no
; filesystem or image file in between.  The card must therefore *be* a disk --
; write a bootable image to it whole (dd / Win32DiskImager), not copy an .img
; onto a FAT volume.  This is why the config lives here in flash: the card no
; longer holds files the ESP can read.
;
; Set USE_RAWSD in board_picocalc.h to match, so storage.c initialises the card
; without mounting FAT on it.  Otherwise the ESP mounts the guest's filesystem
; at the same time and both sides cache it, which corrupts it on the first
; write from either.
hda = /dev/mmcblk0

; Alternatives: an image file on a FAT card (needs a card ini, or paths here),
; or a small image kept in this partition alongside the config.
; hda = /sdcard/hd.img
; hda = /spiflash/hd.img

; fixes "MS-DOS compatibility mode" in win9x, but breaks winNT
fill_cmos = 1

[display]
; must match LCD_WIDTH/LCD_HEIGHT in esp/main/board_picocalc.h
width = 320
height = 320

[cpu]
; 3/4/5/6 = 386/486/586/686
gen = 6
fpu = 1
